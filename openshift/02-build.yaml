apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: message-triage-dashboard
  namespace: message-triage
  labels:
    app.kubernetes.io/name: message-triage-dashboard
    app.kubernetes.io/part-of: ai-message-triage
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: message-triage-dashboard
  namespace: message-triage
  labels:
    app.kubernetes.io/name: message-triage-dashboard
    app.kubernetes.io/part-of: ai-message-triage
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/burrsutter/ai-message-triage-dashboard.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: message-triage-dashboard:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
